workflows:
  flutter-build:
    name: Flutter build for monorepo
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd apps/frontend
          flutter pub get
      - name: Build APK
        script: |
          cd apps/frontend
          flutter build apk --release
    artifacts:
      - apps/frontend/build/app/outputs/flutter-apk/app-release.apk



